name: Tests and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q projectmirror tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke checks
        run: |
          python -m projectmirror --help
          python -m projectmirror doctor
          python -m projectmirror audit --help
      - name: Build package
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Check wheel contents and excluded launch assets
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, f'Expected one wheel, found {wheels}'
          with ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          assert 'projectmirror/skill_bundle/SKILL.md' in names
          assert sum(n.startswith('projectmirror/skill_bundle/references/') for n in names) == 4
          assert not any('docs/launch/' in n or n.endswith('launch-stats.csv')
                         or n.endswith('mirrormap-30s-demo.mp4') for n in names)
          print('Packaged skill and reference files verified; launch assets excluded')
          PYCODE
      - name: Check skill and generated HTML
        run: |
          python -m projectmirror audit examples/demo-app --out "${RUNNER_TEMP}/mirrormap-ci"
          test -s "${RUNNER_TEMP}/mirrormap-ci/dashboard.html"
          test -s "${RUNNER_TEMP}/mirrormap-ci/audit-report.md"
