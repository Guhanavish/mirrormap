name: MirrorMap evidence audit (example)
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MirrorMap from trusted source (pin a reviewed SHA in production)
        run: python -m pip install 'git+https://github.com/Guhanavish/mirrormap.git@main'
      - name: Structural audit (no app code execution)
        env:
          MIRRORMAP_BASE: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/mirrormap-report"
          if [ -f docs/requirements.md ]; then
            python -m projectmirror audit . --mode pr --base "origin/${MIRRORMAP_BASE:-main}" \
              --spec docs/requirements.md --out "${RUNNER_TEMP}/mirrormap-report"
          else
            python -m projectmirror audit . --mode pr --base "origin/${MIRRORMAP_BASE:-main}" \
              --out "${RUNNER_TEMP}/mirrormap-report"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrormap-evidence-report
          path: ${{ runner.temp }}/mirrormap-report/
          if-no-files-found: warn
          retention-days: 7
