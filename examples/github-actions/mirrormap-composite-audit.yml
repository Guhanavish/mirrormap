# Copy to .github/workflows/mirrormap-pr.yml in a project that has an approved spec.
# Prefer pinning `uses: Guhanavish/mirrormap@<reviewed-commit-sha>` after testing.
name: MirrorMap PR inventory
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only audit
        id: mirrormap
        uses: Guhanavish/mirrormap@main # Example only; pin a reviewed commit SHA in production.
        with:
          mode: pr
          base: origin/${{ github.base_ref || 'main' }}
          spec: docs/requirements.md
          approved-spec: 'false' # Change only after human review of the spec.
      - name: Attach reports
        if: ${{ always() && steps.mirrormap.outputs.report-directory != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mirrormap-pr-audit
          path: ${{ steps.mirrormap.outputs.report-directory }}
          retention-days: 7
          if-no-files-found: warn
