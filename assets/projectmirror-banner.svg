<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">ProjectMirror</title>
<desc id="desc">Dark navy banner with a teal interlinked project graph and the ProjectMirror wordmark</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0a101d"/><stop offset="1" stop-color="#111d2d"/></linearGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#66a7e8"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#50e3bc" stop-opacity=".15"/><stop offset="1" stop-color="#50e3bc" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<circle cx="1015" cy="180" r="245" fill="url(#glow)"/>
<g stroke="#5ce9ca" stroke-opacity=".11" fill="none"><path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360M640 0V360M720 0V360M800 0V360M880 0V360M960 0V360M1040 0V360M1120 0V360"/></g>
