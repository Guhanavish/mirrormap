<g fill="#0a1421" stroke="#64e6cd" stroke-width="4"><circle cx="855" cy="98" r="12"/><circle cx="970" cy="164" r="16"/><circle cx="1085" cy="97" r="12"/><circle cx="855" cy="235" r="12"/><circle cx="1085" cy="235" r="12"/><circle cx="970" cy="300" r="12"/></g>
<circle cx="970" cy="164" r="6" fill="#64e6cd"/>
<g font-family="Arial,Helvetica,sans-serif">
 <rect x="66" y="55" width="191" height="30" rx="15" fill="#132f36" stroke="#2b756e"/>
 <circle cx="86" cy="70" r="4" fill="#66e8cd"/>
 <text x="104" y="75" font-size="13" fill="#a5f1e3" font-weight="700" letter-spacing="2">AGENT SKILL / OPEN SOURCE</text>
 <text x="63" y="162" font-size="72" font-weight="800" fill="#f3f7fb" letter-spacing="-3">Project<tspan fill="#65e7cd">Mirror</tspan></text>
 <text x="68" y="212" font-size="24" fill="#c0ccda">What you planned. What you built. What you proved.</text>
 <text x="68" y="264" font-size="17" fill="#89a1b6">Spec drift  /  evidence-backed audits  /  human-approved fixes</text>
