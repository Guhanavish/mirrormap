name: MirrorMap · Read-only Audit
# This action intentionally produces artifacts only. It never runs target source,
# comments on PRs, modifies code, or approves remediation.
description: Inventory a repository and produce evidence-aware MirrorMap audit artifacts without changing source code.
author: MirrorMap contributors
branding:
  icon: layers
  color: green
inputs:
  mode:
    description: 'Audit mode: quick, deep, pr, drift, or visual (visual requires separate evidence).'
    required: false
    default: quick
  spec:
    description: 'Optional reviewed specification path, relative to the checked-out repo.'
    required: false
    default: ''
  approved-spec:
    description: 'Mark true ONLY if the repository owner has actually approved this specification.'
    required: false
    default: 'false'
  base:
    description: 'Optional Git ref for PR changed-file context; requires sufficient git history.'
    required: false
    default: ''
outputs:
  report-directory:
    description: 'Absolute temporary directory containing generated report artifacts.'
    value: ${{ steps.run-audit.outputs.report_directory }}
runs:
  using: composite
  steps:
    - id: run-audit
      name: Generate read-only audit report
      shell: bash
      env:
        MIRRORMAP_MODE: ${{ inputs.mode }}
        MIRRORMAP_SPEC: ${{ inputs.spec }}
        MIRRORMAP_APPROVED_SPEC: ${{ inputs.approved-spec }}
        MIRRORMAP_BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        : "${GITHUB_WORKSPACE:?This action needs a checked-out project}"
        : "${RUNNER_TEMP:?Temporary output directory is unavailable}"
        export PYTHONPATH="${{ github.action_path }}${PYTHONPATH:+:${PYTHONPATH}}"
        report="$(mktemp -d "${RUNNER_TEMP}/mirrormap.XXXXXXXX")"
        printf 'report_directory=%s\n' "$report" >> "${GITHUB_OUTPUT:?GitHub output file unavailable}"
        args=(audit "$GITHUB_WORKSPACE" --mode "$MIRRORMAP_MODE" --out "$report")
        if [[ -n "$MIRRORMAP_SPEC" ]]; then
          case "$MIRRORMAP_SPEC" in
            /*) spec_path="$MIRRORMAP_SPEC" ;;
            *) spec_path="$GITHUB_WORKSPACE/$MIRRORMAP_SPEC" ;;
          esac
          args+=(--spec "$spec_path")
        fi
        if [[ "$MIRRORMAP_APPROVED_SPEC" == "true" ]]; then
          if [[ -z "$MIRRORMAP_SPEC" ]]; then
            echo 'approved-spec=true requires a specification path' >&2
            exit 2
          fi
          args+=(--approved-spec)
        elif [[ "$MIRRORMAP_APPROVED_SPEC" != "false" ]]; then
          echo 'approved-spec must be true or false' >&2
          exit 2
        fi
        if [[ -n "$MIRRORMAP_BASE" ]]; then
          args+=(--base "$MIRRORMAP_BASE")
        fi
        python3 -m projectmirror "${args[@]}" > "$report/summary.json"
        echo "MirrorMap report stored at: $report"
